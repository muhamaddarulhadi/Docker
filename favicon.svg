<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#1d63ed"/>

  <!-- Container stacks (3 rows) -->
  <!-- Row 3 (top) - 1 box -->
  <rect x="22" y="8" width="11" height="9" rx="2" fill="white" opacity="0.55"/>

  <!-- Row 2 - 2 boxes -->
  <rect x="9"  y="20" width="11" height="9" rx="2" fill="white" opacity="0.75"/>
  <rect x="22" y="20" width="11" height="9" rx="2" fill="white" opacity="0.75"/>

  <!-- Row 1 (main) - 3 boxes -->
  <rect x="9"  y="32" width="11" height="9" rx="2" fill="white" opacity="0.95"/>
  <rect x="22" y="32" width="11" height="9" rx="2" fill="white" opacity="0.95"/>
  <rect x="35" y="32" width="11" height="9" rx="2" fill="white" opacity="0.95"/>

  <!-- Whale body / cloud shape -->
  <path d="M50 30 C50 26 47 24 44 24 L43.5 24 C42 20 38 18 34 20 L9 20" stroke="none" fill="none"/>
  <path d="M52 34 C55 34 57 32 57 29 C57 26 55 24 52 24 C51 24 50 24.5 49.5 25 C48.5 22 46 20 43 20 C40.5 20 38.5 21.5 37.5 23.5" stroke="none" fill="none"/>

  <!-- Whale cloud (simplified, right side) -->
  <ellipse cx="50" cy="31" rx="7" ry="5.5" fill="white" opacity="0.9"/>
  <ellipse cx="54" cy="33" rx="4.5" ry="4" fill="white" opacity="0.9"/>
  <ellipse cx="46" cy="33" rx="4" ry="3.5" fill="white" opacity="0.9"/>
  <!-- Whale spout -->
  <line x1="52" y1="26" x2="52" y2="22" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <line x1="52" y1="22" x2="55" y2="19" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="52" y1="22" x2="50" y2="18" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Water wave line -->
  <path d="M6 45 Q14 42 22 45 Q30 48 38 45 Q46 42 58 45" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
